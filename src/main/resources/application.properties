# ==========================================
# Google OAuth2
# ==========================================
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.oauth.refresh-token=${GOOGLE_OAUTH_REFRESH_TOKEN}
google.redirect.uri=${GOOGLE_OAUTH_REDIRECT_URI}
google.oauth.access-token=${GOOGLE_OAUTH_ACCESS_TOKEN}
google.oauth.email=${GOOGLE_OAUTH_EMAIL}
google.oauth.authorization-uri=${GOOGLE_OAUTH_AUTHORIZATION_URI}
google.oauth.token-uri=${GOOGLE_OAUTH_TOKEN_URI}
google.oauth.scope=${GOOGLE_OAUTH_SCOPE}
google.oauth.access-type=offline
google.oauth.prompt=consent



